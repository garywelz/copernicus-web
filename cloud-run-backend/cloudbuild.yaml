# Google Cloud Build configuration for copernicus-podcast-api.
#
# Build and push ONLY. Deploys are manual and gated -- this file used to
# also deploy straight to 100% of traffic on every successful build, which
# is exactly the risk a gated rollout exists to avoid. Follow
# cloud-run-backend/DEPLOY.md for the actual deploy procedure: build from a
# clean checkout, deploy by image digest with --no-traffic and a tag, diff
# the revision specs, smoke-test the tagged URL, then move traffic only
# after approval.
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/copernicus-podcast-api:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/copernicus-podcast-api:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/copernicus-podcast-api:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/copernicus-podcast-api:latest']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/copernicus-podcast-api:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/copernicus-podcast-api:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Timeout for the entire build
timeout: '1200s'
