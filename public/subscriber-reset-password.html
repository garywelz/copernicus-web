<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Copernicus AI - Choose a New Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 400px; }
        h1 { font-size: 24px; color: #333; text-align: center; margin-bottom: 8px; }
        .sub { color: #666; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .message.error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .message.success { background: #efe; color: #363; border: 1px solid #cfc; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose a new password</h1>
        <p class="sub">Copernicus AI Subscriber Portal</p>
        <div id="message" class="message" style="display: none;" role="status"></div>
        <form id="resetForm" style="display: none;">
            <div class="form-group">
                <label for="newPassword">New password (8 to 128 characters)</label>
                <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Type it again</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit" class="btn" id="resetBtn">Set password</button>
        </form>
        <div class="links">
            <a id="loginLink" href="/subscriber-login.html">Back to sign in</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://copernicus-podcast-api-phzp4ie2sq-uc.a.run.app';

        // The token arrives in the URL fragment, which the browser never sends to a server. Read it, then remove it from
        // the address bar and the history entry so it is not left lying around.
        const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const token = params.get('token');
        try { history.replaceState(null, '', window.location.pathname); } catch (e) {}

        const messageEl = document.getElementById('message');
        const form = document.getElementById('resetForm');

        function show(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
        }

        if (!token) {
            show('This link is incomplete. Open the link from the email again, or request a new one from the sign-in page.', 'error');
        } else {
            form.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value;
            if (pw !== document.getElementById('confirmPassword').value) {
                show('The two passwords do not match.', 'error');
                return;
            }
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            try {
                const response = await fetch(`${API_BASE}/api/subscribers/password-reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: pw })
                });
                let result = {};
                try { result = await response.json(); } catch (err) {}
                if (response.ok) {
                    form.style.display = 'none';
                    show('Your password has been updated. You can now sign in.', 'success');
                } else {
                    show(result.detail || 'The password could not be changed. Please try again.', 'error');
                    btn.disabled = false;
                }
            } catch (error) {
                show('Network error. Please try again.', 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
